version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the project uses the isar_community fork, never upstream isar
      - dependency-name: isar
      - dependency-name: isar_flutter_libs
    commit-message:
      prefix: "bump(back)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "bump(back)"
