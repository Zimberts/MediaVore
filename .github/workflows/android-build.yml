name: Android APK Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/android-build.yml'
  push:
    tags: ['v*']

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # debug on PRs (fast break detection); release only on tags (signing: #166)
      BUILD_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --${{ env.BUILD_MODE }}

      - uses: actions/upload-artifact@v4
        with:
          name: mediavore-${{ env.BUILD_MODE }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_MODE }}.apk
          retention-days: 7
