name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Reused by release.yml so that no release is built from a red commit.
  workflow_call:

# In a called workflow `github.workflow` is the caller's name, so a release run
# never shares (and cancels) the group of the plain CI run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `.env` is declared as an asset in pubspec.yaml but is not committed.
      - name: Create placeholder .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Isar tests call Isar.initializeIsarCore(download: true). Without the
      # library in place, parallel test processes each download it: one
      # truncates libisar.so while another already has it mapped, and that
      # process dies with SIGBUS (exit code -7). Provide it once, from the
      # pub cache (same version as isar_community).
      - name: Provide the Isar native library for tests
        run: |
          lib=$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*/isar_community_flutter_libs-*/linux/libisar.so' | sort | tail -n1)
          test -n "$lib"
          echo "Using $lib"
          cp "$lib" libisar.so

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check format
        continue-on-error: true # make blocking once the codebase is formatted
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
