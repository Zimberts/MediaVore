name: Conventional Commits

# `pull_request_target` so that editing the title re-runs the check without a new push.
# Safe here: no job checks out or runs code from the PR, the token is read-only.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  # With squash-merge the PR title becomes the commit message on `main`.
  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with .pre-commit-config.yaml and AGENTS.md. Scope is free.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            bump

  # Covers non-squash merges: every commit of the PR lands on `main` as is.
  commits:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check every commit subject
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|bump'
          pattern="^(${types})(\([^()]+\))?!?: [^[:space:]]"
          # Fetch first so that an API failure fails the step (bash -e).
          commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | [.sha[0:7], (.commit.message | split("\n")[0])] | @tsv')
          bad=0
          while IFS=$'\t' read -r sha subject; do
            # Merge commits are accepted; fixup!/squash! must be autosquashed before merging.
            if [[ $subject =~ $pattern || $subject == Merge\ * ]]; then
              echo "ok   $sha $subject"
            else
              echo "::error::$sha: '$subject' is not a Conventional Commit (<type>(<scope>): <description>)"
              bad=1
            fi
          done <<< "$commits"
          exit $bad
