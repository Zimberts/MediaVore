name: Release

# A push to `main` runs release-please (DOCS/releasing.md): it keeps the release PR up to
# date and, once that PR is merged, creates the tag vX.Y.Z and the GitHub release; the build
# jobs then run in this same workflow (a tag created with GITHUB_TOKEN triggers no other
# workflow, so there is no `push: tags` trigger). Tags are never pushed by hand. `workflow_dispatch` = manual test build of
# any ref (a tag ref also gets the pubspec/tag check).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iOS build to TestFlight (otherwise it is only built and signed)
        type: boolean
        default: false

# One release at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # A called workflow can only narrow the caller's token: grant what ci.yml's
    # jobs declare (pr-title asks for pull-requests: read, even when skipped).
    permissions:
      contents: read
      pull-requests: read

  release-please:
    name: Release PR / tag
    needs: checks # no tag on a red main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, GitHub release, release branch
      pull-requests: write # release PR
      issues: write # `autorelease: *` labels
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::warning::Secret RELEASE_PLEASE_TOKEN is missing: falling back to GITHUB_TOKEN, so the release PR gets no CI run (see DOCS/releasing.md)."
          fi

      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflow, so its required checks never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  android:
    name: Build Android APK + AAB
    needs: [checks, release-please]
    # release-please is skipped on workflow_dispatch: `!cancelled()` keeps this job alive then.
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # Tag being released, or the dispatched tag; empty for a test build of a branch.
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The release tag points at the merged release PR, which may be older than this run's commit.
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - name: Check pubspec version against tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tool/check_release_version.sh "$RELEASE_TAG"
          else
            echo "Not a tag build: version check skipped."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6 # keep in sync with ci.yml
          channel: stable
          cache: true

      # `.env` is declared as an asset in pubspec.yaml but is not committed.
      - name: Create placeholder .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Release signing: see DOCS/android-release-signing.md (secrets from tool/generate_android_upload_key.sh).
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see DOCS/android-release-signing.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      # Unique, increasing build number (versionCode / CFBundleVersion); the +N in pubspec.yaml is ignored.
      # APK = GitHub release download (#239), AAB = Play Store upload (#242). Same build number.
      - name: Build APK and AAB
        run: |
          flutter build apk --release --build-number "$BUILD_NUMBER"
          flutter build appbundle --release --build-number "$BUILD_NUMBER"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MEDIAVORE_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          MEDIAVORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDIAVORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDIAVORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Android 15+ / Google Play: native libraries must support 16 KB pages.
      - name: Check 16 KB page alignment
        run: |
          tool/check_16kb_alignment.sh build/app/outputs/flutter-apk/app-release.apk
          tool/check_16kb_alignment.sh build/app/outputs/bundle/release/app-release.aab

      - name: Collect artifacts and SHA-256
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab dist/
          cd dist
          # Bare file names, so `sha256sum -c app-release.apk.sha256` works next to the download.
          for f in app-release.apk app-release.aab; do sha256sum "$f" > "$f.sha256"; done
          {
            echo "### Android release artifacts (build ${{ github.run_number }})"
            echo '```'
            cat ./*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Consumed by the GitHub release job (#239) and the Play Store job (#242) of this run.
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediavore-android-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS IPA + TestFlight upload
    needs: [checks, release-please]
    # Same gate as the android job.
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}
      BUNDLE_ID: fr.zimberts.mediavore
      # App Store Connect only accepts uploads built with a recent SDK (raised every spring).
      MIN_XCODE_MAJOR: 26
      KEYCHAIN_PATH: ${{ runner.temp }}/mediavore-signing.keychain-db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - name: Check pubspec version against tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tool/check_release_version.sh "$RELEASE_TAG"
          else
            echo "Not a tag build: version check skipped."
          fi

      # Fail in seconds rather than after the build. Setup: DOCS/ios-release.md.
      - name: Check signing secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see DOCS/ios-release.md)."
            exit 1
          fi

      - name: Check Xcode version
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')
          if [ "$major" -lt "$MIN_XCODE_MAJOR" ]; then
            echo "::error::Xcode $major is too old for App Store Connect uploads (need >= $MIN_XCODE_MAJOR): update runs-on."
            exit 1
          fi

      # Temporary keychain with the Apple Distribution certificate, plus the App Store profile.
      # Deleted by the last step, even on failure.
      - name: Install certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -f pkcs12 -t cert \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | python3 tool/ios_signing.py check-profile "$RUNNER_TEMP/profile.plist" --bundle-id "$BUNDLE_ID" \
            > "$RUNNER_TEMP/signing.env"
          cat "$RUNNER_TEMP/signing.env" >> "$GITHUB_ENV"
          uuid=$(sed -n 's/^IOS_PROFILE_UUID=//p' "$RUNNER_TEMP/signing.env")
          # Xcode 16+ reads the second folder; older versions the first.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          cat "$RUNNER_TEMP/signing.env"

      # The committed project and ios/ExportOptions.plist use automatic signing (local builds).
      - name: Switch to manual signing
        run: |
          ruby -e "require 'xcodeproj'" 2> /dev/null || gem install xcodeproj --no-document
          ruby tool/ios_manual_signing.rb ios/Runner.xcodeproj \
            "$IOS_TEAM_ID" "$IOS_PROFILE_NAME" "$IOS_SIGNING_IDENTITY"
          python3 tool/ios_signing.py export-options ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist" \
            --profile "$IOS_PROFILE_NAME" --identity "$IOS_SIGNING_IDENTITY" \
            --team "$IOS_TEAM_ID" --bundle-id "$BUNDLE_ID"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6 # keep in sync with ci.yml
          channel: stable
          cache: true

      - name: Create placeholder .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Same build number as the Android job of this run (DOCS/releasing.md).
      - name: Build IPA
        run: |
          flutter build ipa --release --build-number "$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Collect IPA and SHA-256
        run: |
          mkdir -p dist
          ipas=(build/ios/ipa/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ] || [ ! -f "${ipas[0]}" ]; then
            echo "::error::Expected one .ipa in build/ios/ipa, found: ${ipas[*]}"
            exit 1
          fi
          cp "${ipas[0]}" dist/mediavore.ipa
          cd dist
          shasum -a 256 mediavore.ipa > mediavore.ipa.sha256
          {
            echo "### iOS release artifact (build ${{ github.run_number }})"
            echo '```'
            cat mediavore.ipa.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept so that a failed upload can be retried by hand (Transporter) without rebuilding.
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediavore-ios-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Release runs always upload; a manual run only with the `testflight` input. Submission
      # of a TestFlight build for App Store review stays manual.
      - name: Upload to TestFlight
        if: needs.release-please.outputs.release_created == 'true' || inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # altool looks up AuthKey_<id>.p8 in this folder.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file dist/mediavore.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect: it appears in TestFlight once processed." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2> /dev/null || true
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/dist.p12" \
                 "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
