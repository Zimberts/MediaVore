name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # manual test build

# One release at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  android:
    name: Build Android APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6 # keep in sync with ci.yml
          channel: stable
          cache: true

      # `.env` is declared as an asset in pubspec.yaml but is not committed.
      - name: Create placeholder .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Release signing: see DOCS/android-release-signing.md (secrets from tool/generate_android_upload_key.sh).
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see DOCS/android-release-signing.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build APK
        run: flutter build apk --release
        env:
          MEDIAVORE_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          MEDIAVORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDIAVORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDIAVORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediavore-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
