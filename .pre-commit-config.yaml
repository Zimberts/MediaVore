# Local git hooks. One-time setup (see README.md):
#   pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Conventional Commits on every commit message: `<type>(<scope>)!: <description>`.
  # Keep the type list in sync with .github/workflows/pr-title.yml and AGENTS.md.
  # Non-strict mode: `Merge ...`, `fixup!` and `squash!` commits are accepted.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, bump]

  # Same check as CI (`dart format --set-exit-if-changed lib test`), on staged
  # Dart files only. Generated files are gitignored, so never staged.
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        types: [dart]
        files: ^(lib|test)/
        stages: [pre-commit]
