name: mediavore
description: "App to keep track of media seen"
publish_to: "none"

version: 1.3.0+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  equatable: ^2.1.0
  get_it: ^7.6.7
  injectable: ^2.4.2
  cached_network_image: ^4.0.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.2
  intl: ^0.20.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  app_links: ^7.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  reorderable_grid_view: ^2.2.8
  fl_chart: ^0.70.0
  scrollable_positioned_list: ^0.3.8
  rxdart: ^0.27.7
  archive: ^4.5.2
  csv: ^8.0.0
  workmanager: ^0.9.0+3
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  injectable_generator: ^2.10.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
flutter_native_splash:
  color: "#000000" # Comme pour ton icône adaptive
  image: "assets/icon/app_icon.png" # On réutilise ton icône pour le centre de l'écran
  ios: true
  android: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true # App Store rejects an app icon with an alpha channel
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icon/
    - assets/achievements/
