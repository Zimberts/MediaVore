name: mediavore
description: "App to keep track of media seen"
publish_to: "none"

version: 1.4.4+9

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  equatable: ^3.0.0
  get_it: ^9.3.0
  injectable: ^2.4.2
  cached_network_image: ^4.0.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.2
  intl: ^0.20.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  app_links: ^7.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  reorderable_grid_view: ^2.2.8
  fl_chart: ^1.3.1
  scrollable_positioned_list: ^0.3.8
  rxdart: ^0.28.0
  archive: ^4.7.1
  csv: ^8.0.0
  workmanager: ^0.10.10
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  # App-level test harness (test/app/): fake image cache, path provider and
  # background sync.
  file: ^7.0.1
  flutter_cache_manager: ^3.4.1
  path_provider_platform_interface: ^2.1.2
  workmanager_android: ^0.10.9
  injectable_generator: ^2.10.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.8
flutter_native_splash:
  color: "#000000" # Comme pour ton icône adaptive
  image: "assets/icon/app_icon.png" # On réutilise ton icône pour le centre de l'écran
  ios: true
  android: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true # App Store rejects an app icon with an alpha channel
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icon/
    - assets/achievements/
    - assets/fonts/bricolage_grotesque/OFL.txt
    - assets/fonts/inter/OFL.txt
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque24pt-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
